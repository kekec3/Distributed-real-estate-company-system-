---
#blockchain
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ganache
spec:
  selector:
    matchLabels:
      app: ganache
  template:
    metadata:
      labels:
        app: ganache
    spec:
      containers:
        - name: ganache
          image: trufflesuite/ganache-cli
          args: ["--deterministic", "--accounts", "10", "--host", "0.0.0.0"]
          ports:
            - containerPort: 8545
---
apiVersion: v1
kind: Service
metadata:
  name: ganache
spec:
  type: LoadBalancer
  selector:
    app: ganache
  ports:
    - port: 8545
      targetPort: 8545
